<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flavor History</title>
<style>
:root{--blue:#1976d2;--navy:#173b57;--line:#dbe4ec;--soft:#f5f7fa;--green:#2e7d32}
*{box-sizing:border-box}
body{margin:0;background:var(--soft);color:#1f2933;font-family:Arial,sans-serif}
header{background:var(--blue);color:#fff;padding:16px;text-align:center;font-size:23px;font-weight:700}
.container{max-width:850px;margin:auto;padding:16px}
.back{display:inline-block;margin-bottom:14px;padding:9px 14px;background:var(--blue);color:#fff;text-decoration:none;border-radius:8px;font-weight:700}
h1{font-size:28px;margin:2px 0 4px;color:var(--navy)}
.sub{color:#5f6c78;margin:0 0 14px}
.filters{background:#fff;border-radius:12px;padding:13px;box-shadow:0 2px 8px rgba(0,0,0,.1);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
label{font-size:13px;font-weight:700;color:#455565}
select,input{display:block;width:100%;margin-top:5px;padding:10px 8px;border:1px solid #b8c4cf;border-radius:8px;background:#fff;color:#1f2933;font-size:15px}
.customDates{display:none;grid-column:1/-1;grid-template-columns:1fr 1fr;gap:10px}
.summary{font-size:14px;color:#52606d;margin:8px 2px}
.tableWrap{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1);overflow:hidden}
.feedHead,.feedRow{display:grid;grid-template-columns:88px minmax(100px,1fr) minmax(160px,2fr);align-items:stretch}
.feedHead{background:var(--navy);color:#fff;font-weight:700;font-size:14px}
.feedHead div,.feedRow>div{padding:11px 9px;border-right:1px solid rgba(255,255,255,.16)}
.feedHead div:last-child,.feedRow>div:last-child{border-right:0}
.feedRow{border-bottom:1px solid var(--line);font-size:15px}
.feedRow:last-child{border-bottom:0}
.date{font-weight:700;color:var(--navy)}
.day{display:block;font-size:12px;font-weight:400;color:#687784;margin-top:3px}
.shift{font-weight:700}
.volunteer{display:block;font-size:12px;font-weight:400;color:#687784;margin-top:3px}
.amount{text-align:center;font-weight:700}
.muted{color:#9aa5b1;font-weight:400}
.additionalFood{background:#f5f0ff;color:#5b21b6}
.additionalFood .date,.additionalFood .shift,.additionalFood .volunteer,.additionalFood .day{color:#5b21b6}
.additionalBadge{display:inline-block;margin-top:4px;padding:2px 6px;border-radius:999px;background:#6d28d9;color:#fff;font-size:10px;font-weight:700;letter-spacing:.02em}
.state{padding:26px 16px;text-align:center;color:#5f6c78}
@media(max-width:620px){
 .container{padding:12px}
 .filters{grid-template-columns:1fr 1fr}
 .feedHead,.feedRow{grid-template-columns:70px 90px minmax(0,1fr)}
 .feedHead div,.feedRow>div{padding:10px 5px}
 .feedHead{font-size:12px}
 .feedRow{font-size:13px}
 .day,.volunteer{font-size:11px}
 h1{font-size:25px}
}
</style>
</head>
<body>
<header>Flavor History</header>
<main class="container">
<a id="backLink" class="back" href="baytowne.html">← Baytowne</a>
<h1 id="title">Flavor History</h1>
<p class="sub">Food flavors recorded in Baytowne’s Daily Form, newest first.</p>

<section class="filters" aria-label="Feeding history filters">
<label>Flavor<select id="flavor"><option value="">All flavors</option><option>SH Chicken Pate</option><option>SH Chicken &amp; Tuna</option><option>SH Salmon</option><option>FF Chicken Pate</option><option>FF Salmon</option><option>Redford Chicken Pate</option><option value="other">Other</option></select></label>
<label>Show<select id="period">
<option value="30" selected>Last 30 days</option>
<option value="60">Last 60 days</option>
<option value="90">Last 90 days</option>
<option value="all">All available</option>
<option value="custom">Date range</option>
</select></label>
<label>Weekday<select id="weekday">
<option value="">All days</option>
<option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option>
</select></label>
<label>Shift<select id="shift">
<option value="">All shifts</option><option>Breakfast</option><option>Lunch</option><option>Dinner</option>
</select></label>
<div id="customDates" class="customDates">
<label>From<input id="fromDate" type="date"></label>
<label>Through<input id="toDate" type="date"></label>
</div>
</section>

<div id="summary" class="summary">Loading flavor history…</div>
<section class="tableWrap">
<div class="feedHead"><div>Date</div><div>Shift</div><div>Flavor(s) served</div></div>
<div id="rows"><div class="state">Loading…</div></div>
</section>
</main>
<script>
const SETTINGS_URL="https://script.google.com/macros/s/AKfycbxjbnFhs4Q0dUt9PGbd1z8PlRTzCwu-c6ge2ZsAj9-HqYsdcs_Sj26zql_hXSzZGG_b/exec?action=settings";
const flavors=["SH Chicken Pate","SH Chicken & Tuna","SH Salmon","FF Chicken Pate","FF Salmon","Redford Chicken Pate"];
let records=[];
document.getElementById("title").textContent="Baytowne Flavor History";
function esc(value){return String(value??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function cutoff(days){
 const today=new Intl.DateTimeFormat("en-CA",{timeZone:"America/New_York",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
 const parts=Object.fromEntries(today.map(p=>[p.type,p.value]));
 const d=new Date(Date.UTC(Number(parts.year),Number(parts.month)-1,Number(parts.day)));
 d.setUTCDate(d.getUTCDate()-Number(days)+1);
 return d.toISOString().slice(0,10);
}
function render(){
 const weekday=document.getElementById("weekday").value,shift=document.getElementById("shift").value,flavor=document.getElementById("flavor").value,period=document.getElementById("period").value;
 const from=document.getElementById("fromDate").value,through=document.getElementById("toDate").value;
 document.getElementById("customDates").style.display=period==="custom"?"grid":"none";
 const shown=records.filter(r=>{
   if(r.store!=="Baytowne")return false;
   if(weekday&&r.weekday!==weekday)return false;
   if(shift&&r.shift!==shift)return false;
   if(flavor){
     const choices=String(r.flavors||"").split(/,\s*/).filter(Boolean);
     if(flavor==="other"){if(!choices.some(c=>!flavors.includes(c)))return false}
     else if(!choices.includes(flavor))return false;
   }
   if(period==="custom"){if(from&&r.dateIso<from)return false;if(through&&r.dateIso>through)return false}
   else if(period!=="all"&&r.dateIso<cutoff(period))return false;
   return true;
 }).sort((a,b)=>Number(b.timestamp)-Number(a.timestamp));
 document.getElementById("summary").textContent=shown.length+(shown.length===1?" entry":" entries")+" shown";
 document.getElementById("rows").innerHTML=shown.length?shown.map(r=>'<div class="feedRow"><div class="date">'+esc(r.date)+'<span class="day">'+esc(r.weekday)+'</span></div><div class="shift">'+esc(r.shift)+'<span class="volunteer">'+esc(r.volunteer)+'</span></div><div style="overflow-wrap:anywhere;line-height:1.5">'+esc(r.flavors)+'</div></div>').join(""):'<div class="state">'+(records.length?'No flavor entries match these filters.':'No flavors recorded yet. Selections from Baytowne’s Daily Form will appear here.')+'</div>';
}
async function loadHistory(){
 try{
  const settingsResponse=await fetch(SETTINGS_URL);if(!settingsResponse.ok)throw Error();
  const settings=await settingsResponse.json();if(!settings.PortalDeploymentURL)throw Error();
  const response=await fetch(settings.PortalDeploymentURL+"?action=flavorHistory&limit=5000");if(!response.ok)throw Error();
  const data=await response.json();if(!data||!data.success||!Array.isArray(data.records))throw Error();
  records=data.records;render();
 }catch(error){document.getElementById("summary").textContent="";document.getElementById("rows").innerHTML='<div class="state">Flavor history is temporarily unavailable. Please try again.</div>'}
}
["flavor","period","weekday","shift","fromDate","toDate"].forEach(id=>document.getElementById(id).addEventListener("change",render));
loadHistory();
</script>
</body>
</html>
