<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shift Notes</title>

<style>

body{
    margin:0;
    background:#f5f7fa;
    font-family:Arial,sans-serif;
}

header{
    background:#1976d2;
    color:white;
    padding:18px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.backButton{

    display:inline-block;

    margin-bottom:20px;

    padding:10px 18px;

    background:#1976d2;

    color:white;

    text-decoration:none;

    border-radius:8px;

    font-weight:bold;

}

.storeTitle{

    font-size:28px;

    margin-bottom:25px;

    color:#333;

}

#notes{

    display:flex;

    flex-direction:column;

    gap:18px;

}

</style>

</head>

<body>

<header>

Shift Notes

</header>

<div class="container">

<a class="backButton" href="index.html">

← Back to RTCats

</a>

<div class="storeTitle" id="storeTitle">

Loading...

</div>

<div id="notes">

</div>

</div>
<script>

const params = new URLSearchParams(window.location.search);

const store = params.get("store") || "Brighton";

const displayNames = {
    "Brighton": "Brighton",
    "Baytowne": "Baytowne",
    "Hard Rd": "Hard Rd"
};

document.getElementById("storeTitle").textContent =
    (displayNames[store] || store) + " Shift Notes";

const notesDiv = document.getElementById("notes");

notesDiv.textContent = "Loading shift notes...";

fetch("https://script.google.com/macros/s/AKfycbxjbnFhs4Q0dUt9PGbd1z8PlRTzCwu-c6ge2ZsAj9-HqYsdcs_Sj26zql_hXSzZGG_b/exec?action=shiftnotes&store=" + encodeURIComponent(store))
.then(response => response.json())
.then(data => {

    notesDiv.innerHTML = "";

    if (data.length === 0) {

        notesDiv.innerHTML = "<p>No shift notes found.</p>";
        return;

    }

    data.forEach(note => {

        const card = document.createElement("div");

        card.style.background = "white";
        card.style.padding = "15px";
        card.style.marginBottom = "15px";
        card.style.borderRadius = "8px";
        card.style.boxShadow = "0 2px 6px rgba(0,0,0,.15)";

        card.innerHTML = `
            <strong>${note.volunteer}</strong><br>
            ${note.shift}<br><br>
            ${note.note}<br><br>
            <small>${note.source}</small>
        `;

        notesDiv.appendChild(card);

    });

})
.catch(error => {

    notesDiv.textContent = "Unable to load shift notes.";

    console.error(error);

});

</script>
</body>
   </html>
