<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shift Notes</title>

<style>

body{
    margin:0;
    background:#f5f7fa;
    font-family:Arial,sans-serif;
}

header{
    background:#1976d2;
    color:white;
    padding:18px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.backButton{

    display:inline-block;

    margin-bottom:20px;

    padding:10px 18px;

    background:#1976d2;

    color:white;

    text-decoration:none;

    border-radius:8px;

    font-weight:bold;

}

.storeTitle{

    font-size:28px;

    margin-bottom:25px;

    color:#333;

}

#notes{

    display:flex;

    flex-direction:column;

    gap:18px;

}

</style>

</head>

<body>

<header>

Shift Notes

</header>

<div class="container">

<a class="backButton" href="index.html">

← Back to RTCats

</a>

<div class="storeTitle" id="storeTitle">

Loading...

</div>

<div id="notes">

</div>

</div>
<script>

const params = new URLSearchParams(window.location.search);

const store = params.get("store") || "Brighton";

const displayNames = {
    "Brighton": "Brighton",
    "Baytowne": "Baytowne",
    "Hard Rd": "Hard Rd"
};

document.getElementById("storeTitle").textContent =
    (displayNames[store] || store) + " Shift Notes";

const notesDiv = document.getElementById("notes");

notesDiv.textContent = "Loading shift notes...";

fetch("https://script.google.com/macros/s/AKfycbxjbnFhs4Q0dUt9PGbd1z8PlRTzCwu-c6ge2ZsAj9-HqYsdcs_Sj26zql_hXSzZGG_b/exec?action=shiftnotes&store=" + encodeURIComponent(store))
.then(response => response.json())
.then(data => {

    notesDiv.innerHTML = "";

    if (data.length === 0) {
        notesDiv.innerHTML = "<p>No shift notes found.</p>";
        return;
    }

    data.forEach(note => {

        const card = document.createElement("div");

        card.style.background = "#ffffff";
        card.style.borderRadius = "10px";
        card.style.padding = "16px";
        card.style.marginBottom = "16px";
        card.style.boxShadow = "0 2px 8px rgba(0,0,0,.12)";

        const when = new Date(note.timestamp);

        const prettyDate = when.toLocaleDateString(undefined,{
            weekday:"long",
            month:"long",
            day:"numeric"
        });

        const prettyTime = when.toLocaleTimeString([],{
            hour:"numeric",
            minute:"2-digit"
        });

        card.innerHTML = `
            <div style="font-size:13px;color:#666;margin-bottom:8px;">
                ${prettyDate} • ${prettyTime}
            </div>

            <div style="font-size:20px;font-weight:bold;">
                ${note.volunteer}
            </div>

            <div style="color:#1976d2;font-weight:bold;margin-bottom:12px;">
                ${note.shift}
            </div>

            <div style="font-size:16px;line-height:1.5;">
                ${note.note}
            </div>

            <hr style="margin:15px 0;">

            <div style="
    display:inline-block;
    margin-top:8px;
    padding:4px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
    color:white;
    background:${note.source === "Daily Log" ? "#1976d2" : "#43a047"};
">
    ${note.source}
</div>
        `;

        notesDiv.appendChild(card);

    });

})
.catch(error => {

    notesDiv.textContent = "Unable to load shift notes.";

    console.error(error);

});

</script>
</body>
   </html>
