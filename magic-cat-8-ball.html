<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0f766e" />
  <title>Magic Cat 8 Ball | RTCats HQ</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:#17233c;background:radial-gradient(circle at 50% 25%,#d9fff6 0,#c8f5ec 30%,#fff6d8 100%);padding-bottom:44px}
    header{background:#0f766e;color:#fff;padding:15px 18px;box-shadow:0 4px 16px #0f4f4a33}
    .bar{max-width:920px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .back{color:#fff;text-decoration:none;font-weight:900;background:#ffffff20;padding:10px 13px;border-radius:999px}
    .shell{width:min(680px,calc(100% - 32px));margin:34px auto 0;text-align:center}
    h1{font-size:clamp(34px,8vw,58px);margin:0 0 14px;letter-spacing:-1.5px}
    .howto{background:#fff;border:3px solid #fff;border-radius:20px;padding:18px 20px;box-shadow:0 8px 26px #0f766e1c;font-size:17px;line-height:1.5}
    .howto strong{color:#0f766e}
    .quote{display:block;margin-top:10px;font-weight:800;color:#6b4d12}
    label{display:block;margin:25px 0 9px;font-weight:900;font-size:18px}
    input{width:min(500px,100%);min-height:52px;border:3px solid #0f766e;border-radius:14px;padding:10px 14px;font:inherit;font-size:17px;background:#fff}
    input:focus{outline:4px solid #facc15;outline-offset:2px}
    .ball{width:min(340px,82vw);aspect-ratio:1;margin:24px auto 18px;border-radius:50%;background:radial-gradient(circle at 34% 26%,#4b5563 0,#111827 30%,#020617 72%);box-shadow:inset -22px -26px 38px #000,0 17px 28px #0f4f4a3d;display:grid;place-items:center;position:relative}
    .window{width:88%;height:92%;display:grid;place-items:center;padding:0;clip-path:polygon(50% 1%,99% 94%,1% 94%);background:radial-gradient(circle,#2563eb,#172554 72%);color:#fff;text-shadow:0 0 8px #60a5fa;font-weight:900;font-size:clamp(16px,4vw,20px);line-height:1.18;text-align:center;overflow:hidden}.answer-text{display:block;width:58%;max-height:58%;margin-top:24%;overflow:hidden}
    .eight{font-size:88px;width:140px;height:140px;display:grid;place-items:center;border-radius:50%;background:#fff;color:#111827;font-weight:900;box-shadow:inset 0 0 0 7px #dbeafe}
    .ball.answered .eight{display:none}.ball:not(.answered) .window{display:none}
    button{min-height:52px;border:0;border-radius:999px;background:#f2b827;color:#17233c;padding:12px 25px;font-weight:900;font-size:18px;cursor:pointer;box-shadow:0 5px 0 #b7791f;transition:.15s}
    button:hover{transform:translateY(-2px)}button:active{transform:translateY(3px);box-shadow:0 2px 0 #b7791f}button:disabled{cursor:wait;opacity:.72;transform:none}
    .prompt{min-height:24px;margin:13px 0 0;font-weight:800;color:#9a3412}
    .shake{animation:shake .36s ease-in-out 6}
    @keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-7deg)}40%{transform:rotate(7deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(5deg)}}
    @media(max-width:520px){.shell{margin-top:24px}.howto{font-size:15px;padding:15px}.ball{margin-top:18px}.window{font-size:clamp(15px,4.5vw,18px)}.answer-text{width:60%;margin-top:25%}.bar strong{font-size:13px}}
    @media(prefers-reduced-motion:reduce){.shake{animation:none}button{transition:none}}
  </style>
</head>
<body>
  <header><div class="bar"><a class="back" href="cat-corner.html">← Cat Corner</a><strong>EXTREMELY SCIENTIFIC</strong><span aria-hidden="true">🐾</span></div></header>
  <main class="shell">
    <h1>🐾 Magic Cat 8 Ball</h1>
    <div class="howto">
      Cats are famously consistent about food. Type the flavor you are thinking
      of leaving down, ask the all-knowing ball, and obey its ruling—or don't.
      The cat certainly won't.
      <span class="quote">For the “I liked it yesterday but will only bury it today” factor.</span>
    </div>
    <label for="flavor">Should I leave down…</label>
    <input id="flavor" maxlength="60" placeholder="Example: chicken pâté" autocomplete="off" />
    <div class="ball" id="ball" aria-live="polite">
      <div class="eight">8</div>
      <div class="window"><span class="answer-text" id="answer"></span></div>
    </div>
    <button id="ask" type="button">Ask the Cats</button>
    <p class="prompt" id="prompt" role="status"></p>
  </main>
  <script>
    const answers = [
      "It is certain—if you add gravy.",
      "It is decidedly tuna.",
      "Without a doubt. Serve it and walk away.",
      "Yes, definitely. Pretend it was my idea.",
      "You may rely on it. I won't.",
      "As I see it, yes—for the next seven minutes.",
      "Most likely, unless I smell chicken.",
      "Outlook good. Bowl placement questionable.",
      "Yes, but only on the cleanest plate.",
      "Signs point to yes. My tail points to no.",
      "Reply hazy. Shake the treat bag.",
      "Ask again after I inspect the other bowls.",
      "Better not tell you now. The dog is listening.",
      "Cannot predict now. Currently washing a leg.",
      "Concentrate and ask again. Use my full title.",
      "Don't count on it, human.",
      "My reply is no—but leave it anyway.",
      "My sources say no. My sources are me.",
      "Outlook not so good. Have you tried tuna?",
      "Very doubtful. Yesterday was another lifetime.",
      "It is certain. I have already claimed the bowl.",
      "It is decidedly so. Now open the can faster.",
      "Without a doubt—but warm it slightly.",
      "Yes, definitely. I may even eat around the edges.",
      "You may rely on it until I change my mind.",
      "As I see it, yes. I see everything.",
      "Most likely. Is that the good spoon?",
      "Outlook good. Aroma acceptable. Proceed.",
      "Yes. Place it three inches to the left.",
      "Signs point to yes—and toward the treat cabinet.",
      "Reply hazy. My whiskers are still calculating.",
      "Ask again after my pre-dinner nap.",
      "Better not tell you now. Another cat might hear.",
      "Cannot predict now. The plate is the wrong color.",
      "Concentrate and ask again without making eye contact.",
      "Don't count on it. I remember what you served Tuesday.",
      "My reply is no. I requested poultry, not betrayal.",
      "My sources say no—and they have excellent whiskers.",
      "Outlook not so good. The pâté has offended me.",
      "Very doubtful. I can see the bottom of the bowl.",
      "Certainly. But call it a tasting menu.",
      "Absolutely. I have been starving for eleven minutes.",
      "Yes—but mash it properly, kitchen staff.",
      "Proceed. I will supervise from six feet away.",
      "The flavor is acceptable. Your service needs work.",
      "All paws point to yes.",
      "The spirits say yes. The nose says investigate first.",
      "Chances are excellent. Compliments remain unlikely.",
      "Approved—subject to a sniff inspection.",
      "Yes, and make the portion look accidental.",
      "Maybe. Put it down and avert your eyes.",
      "Ask again when the can opener is present.",
      "The answer is unclear. Add a decorative treat.",
      "Future uncertain. Bowl suspiciously clean.",
      "I cannot say. Someone moved my favorite blanket.",
      "The signs are mixed. Is there a backup flavor?",
      "No prediction until you say 'Your Majesty.'",
      "Try again after rotating the plate clockwise.",
      "No. I have chosen hunger for dramatic effect.",
      "Absolutely not. Leave it there just in case.",
      "My answer is no. My second answer may be breakfast.",
      "Unlikely—but I will lick the gravy to be polite.",
      "No chance. Unless the other cat wants it.",
      "The outlook is bleak. The treat outlook is better.",
      "I reject this flavor on mysterious personal grounds.",
      "Not today. Yesterday's review has been withdrawn.",
      "Hard no. Please submit a new menu for approval.",
      "Doubtful. It lacks the essence of forbidden counter food.",
      "No—but I reserve the right to eat it at 3 a.m.",
      "Ask the other cat. I refuse to be accountable.",
      "The answer is yes. This conversation never happened.",
      "Feed it. I will decide whether it was correct afterward.",
      "Approved for immediate burial beside the bowl.",
      "It may please me. Do not look hopeful.",
      "Yes, but I expect a clean dish and zero witnesses.",
      "The stars say yes. The stomach says hurry.",
      "Outcome favorable. Tip your server with treats.",
      "Permission granted—for one cautious nibble.",
      "Leave it down. I enjoy having options to ignore.",
      "Serve it. I need something fresh to complain about."
    ];
    const input = document.getElementById("flavor");
    const ball = document.getElementById("ball");
    const answer = document.getElementById("answer");
    const prompt = document.getElementById("prompt");
    const askButton = document.getElementById("ask");
    let revealTimer;
    let answerDeck = [];
    function nextAnswer(){
      if(!answerDeck.length){
        answerDeck = answers.map((_,index)=>index);
        for(let i=answerDeck.length-1;i>0;i--){
          const j = Math.floor(Math.random()*(i+1));
          [answerDeck[i],answerDeck[j]] = [answerDeck[j],answerDeck[i]];
        }
      }
      return answers[answerDeck.pop()];
    }
    function askCats(){
      const flavor = input.value.trim();
      if(!flavor){
        prompt.textContent = "The cats require a flavor to judge. They are professionals.";
        input.focus();
        return;
      }
      clearTimeout(revealTimer);
      prompt.textContent = "The cats are considering your offering…";
      askButton.disabled = true;
      askButton.textContent = "Consulting the Cats…";
      ball.classList.remove("shake","answered");
      answer.textContent = "";
      void ball.offsetWidth;
      ball.classList.add("shake");
      revealTimer = setTimeout(() => {
        answer.textContent = nextAnswer();
        ball.classList.remove("shake");
        ball.classList.add("answered");
        prompt.textContent = "";
        askButton.disabled = false;
        askButton.textContent = "Ask the Cats Again";
      }, 2200);
    }
    askButton.addEventListener("click",askCats);
    input.addEventListener("keydown",event=>{if(event.key==="Enter")askCats()});
  </script>
</body>
</html>
