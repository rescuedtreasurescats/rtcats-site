<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f766e"><title>Wheelie Cat | Cat Corner</title>
<style>
:root{--ink:#17233c;--teal:#0f766e;--cream:#fff8df;--purple:#6d28d9}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;color:var(--ink);background:#b9eee4;overscroll-behavior:none}body{display:flex;justify-content:center;min-height:100dvh;padding-bottom:env(safe-area-inset-bottom)}button,a{font:inherit}.game{width:min(100%,540px);min-height:100dvh;position:relative;overflow:hidden;display:flex;flex-direction:column;background:linear-gradient(180deg,#0f766e 0 13%,#bdf4e9 13% 64%,#fff2bd 64%)}.top{height:13dvh;min-height:88px;padding:13px 15px 9px;color:#fff;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:5px;z-index:5}.back{color:#fff;text-decoration:none;font-weight:900;font-size:13px;justify-self:start;background:#ffffff22;padding:9px 10px;border-radius:999px}.top h1{font-size:clamp(24px,6.7vw,36px);margin:0;text-align:center;line-height:.95;letter-spacing:-1.5px;text-shadow:0 3px 0 #084f4a;white-space:nowrap}.sound{justify-self:end;border:0;background:#ffffff22;color:#fff;border-radius:50%;width:41px;height:41px;font-size:19px}.stats{position:absolute;top:calc(13dvh + 8px);left:13px;right:13px;display:flex;justify-content:space-between;z-index:6;font-weight:900}.pill{background:#ffffffe8;border:2px solid #fff;padding:7px 11px;border-radius:999px;box-shadow:0 5px 14px #064e3b22;font-size:14px}.arena{height:51dvh;min-height:355px;position:relative;display:flex;align-items:flex-end;justify-content:center;padding-bottom:18px}.sky{position:absolute;inset:0;background-image:radial-gradient(#fff9 2px,transparent 2px),radial-gradient(#0d948844 1.5px,transparent 1.5px);background-position:0 0,15px 15px;background-size:30px 30px;opacity:.7}.cloud{position:absolute;color:#fff9;font-size:55px}.cloud.one{left:-10px;top:90px}.cloud.two{right:-22px;top:150px;transform:scale(.8)}.nameplate{position:absolute;top:62px;left:50%;transform:translateX(-50%);z-index:7;background:#fff;border-radius:17px;padding:8px 14px;text-align:center;box-shadow:0 6px 0 #134e4a22;white-space:nowrap}.nameplate strong{display:block;font-size:18px}.nameplate span{font-size:11px;font-weight:900;color:#0f766e;text-transform:uppercase;letter-spacing:1px}.wheel-wrap{width:min(69vw,322px);aspect-ratio:1;position:relative;display:grid;place-items:center;filter:drop-shadow(0 15px 10px #0f766e38)}.wheel{position:absolute;inset:0;border:18px solid var(--purple);border-radius:50%;background:repeating-conic-gradient(#ddd6fe 0 3deg,transparent 3deg 30deg),radial-gradient(circle,#fff 0 11%,#c4b5fd 11% 15%,transparent 15%);box-shadow:inset 0 0 0 8px #8b5cf6,0 0 0 5px #4c1d95;will-change:transform}.wheel.danger{box-shadow:inset 0 0 0 8px #fb7185,0 0 0 5px #be123c,0 0 28px #fb7185}.stand{position:absolute;width:54%;height:17px;background:#4c1d95;border-radius:10px;bottom:-20px}.stand:before,.stand:after{content:"";position:absolute;width:15px;height:58px;background:var(--purple);bottom:8px;border-radius:8px;transform-origin:bottom}.stand:before{left:28%;transform:rotate(24deg)}.stand:after{right:28%;transform:rotate(-24deg)}.cat{position:absolute;width:78%;height:54%;bottom:18%;z-index:4;display:grid;place-items:center;transform-origin:50% 78%;will-change:transform}.cat img{display:block;max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 6px 2px #312e8150);pointer-events:none}.cat.running{animation:bob .17s ease-in-out infinite alternate}.cat.wobble{animation:wobble .1s linear infinite}.cat.launched{animation:launch 1.15s cubic-bezier(.2,.75,.5,1) forwards}.dust{position:absolute;left:10%;bottom:24%;z-index:3;font-size:32px;opacity:0}.running+.dust{opacity:.75;animation:dust .45s linear infinite}.danger-lines{position:absolute;inset:-22px;opacity:0;border-radius:50%;background:repeating-conic-gradient(transparent 0 8deg,#ef444455 9deg 10deg,transparent 11deg 20deg);-webkit-mask:radial-gradient(circle,transparent 0 61%,#000 62%);mask:radial-gradient(circle,transparent 0 61%,#000 62%)}.danger .danger-lines{opacity:1;animation:spin 1s linear infinite}@keyframes bob{to{transform:translateY(-8px) rotate(-2deg) scaleY(.96)}}@keyframes wobble{25%{transform:translate(-6px,-4px) rotate(-8deg)}75%{transform:translate(6px,2px) rotate(8deg)}}@keyframes launch{15%{transform:translate(12px,-20px) rotate(15deg)}100%{transform:translate(125vw,-88vh) rotate(950deg)}}@keyframes dust{to{transform:translate(-35px,-12px) scale(1.7);opacity:0}}@keyframes spin{to{transform:rotate(360deg)}}.countdown{position:absolute;inset:0;z-index:18;display:grid;place-items:center;font-weight:1000;font-size:130px;color:#fff;text-shadow:0 8px 0 #0f766e,0 0 25px #17233c99;pointer-events:none}.hidden{display:none!important}.countdown.pop{animation:countPop .6s ease-out}@keyframes countPop{0%{transform:scale(.35);opacity:0}40%{transform:scale(1.15);opacity:1}100%{transform:scale(.85);opacity:0}}.controls{flex:1;min-height:275px;padding:12px 17px 23px;display:flex;flex-direction:column;gap:11px;position:relative;z-index:8}.meter-label{display:flex;justify-content:space-between;font-weight:900;font-size:12px}.meter{height:29px;background:linear-gradient(90deg,#60a5fa 0 23%,#22c55e 23% 72%,#facc15 72% 86%,#f43f5e 86%);border:4px solid #fff;border-radius:999px;box-shadow:0 5px 0 #92400e22;overflow:hidden;position:relative}.needle{position:absolute;top:-2px;bottom:-2px;width:9px;background:#17233c;border:2px solid #fff;border-radius:999px;left:0;transform:translateX(-50%)}.run{flex:1;min-height:92px;border:0;border-radius:25px;background:linear-gradient(#fb923c,#f97316);color:#fff;font-weight:1000;font-size:clamp(34px,11vw,54px);letter-spacing:2px;box-shadow:0 10px 0 #c2410c,0 16px 25px #9a341e33;touch-action:manipulation;text-shadow:0 3px 0 #c2410c;transition:.06s}.run:disabled{filter:saturate(.6);opacity:.75}.run:active:not(:disabled),.run.pressed{transform:translateY(8px);box-shadow:0 2px 0 #c2410c}.hint{text-align:center;font-size:13px;font-weight:900;color:#78350f;margin:2px 0 0}.toast{position:absolute;left:50%;bottom:29%;transform:translateX(-50%) translateY(12px);z-index:12;background:#17233ce8;color:#fff;padding:9px 14px;border-radius:999px;font-weight:900;font-size:13px;opacity:0;transition:.2s;white-space:nowrap}.toast.show{opacity:1;transform:translateX(-50%)}.overlay{position:absolute;inset:0;background:#082f49e8;z-index:20;display:grid;place-items:center;padding:24px}.card{background:var(--cream);border:5px solid #fff;border-radius:29px;padding:20px;text-align:center;width:min(100%,395px);box-shadow:0 15px 0 #02061744}.result-cat{height:150px;width:100%;object-fit:contain;filter:drop-shadow(0 5px 2px #312e8140)}.card h2{font-size:31px;margin:-3px 0 6px}.card p{font-size:16px;line-height:1.35;margin:7px 0 16px}.again{width:100%;border:0;border-radius:17px;padding:16px;background:var(--teal);color:#fff;font-weight:900;font-size:20px;box-shadow:0 6px 0 #064e3b}.shake{animation:screenShake .3s linear 2}@keyframes screenShake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}@media(max-height:700px){.arena{min-height:315px}.controls{min-height:235px}.nameplate{top:53px}.wheel-wrap{width:min(58vw,275px)}.result-cat{height:115px}}@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important}}
</style></head><body><main class="game" id="game"><header class="top"><a class="back" href="/">← Cat Corner</a><h1>WHEELIE CAT</h1><button class="sound" id="sound" aria-label="Turn sound off">🔊</button></header><div class="stats"><div class="pill">Score: <span id="score">0</span></div><div class="pill">Best: <span id="best">0</span></div></div><section class="arena"><div class="sky"></div><div class="cloud one">☁</div><div class="cloud two">☁</div><div class="nameplate"><strong id="catName"></strong><span>today's wheelie cat</span></div><div class="wheel-wrap" id="wheelWrap"><div class="danger-lines"></div><div class="wheel" id="wheel"></div><div class="cat" id="cat"><img id="catImage" alt="Cartoon cat running"></div><div class="dust">💨</div><div class="stand"></div></div><div class="countdown hidden" id="countdown"></div></section><section class="controls"><div class="meter-label"><span>😴 LOAF</span><span>😸 PURRFECT</span><span>🚀 YEET</span></div><div class="meter"><div class="needle" id="needle"></div></div><button class="run" id="run" disabled>READY?</button><p class="hint">Tap to keep a purrfect pace. Overdo it and… well, physics.</p></section><div class="toast" id="toast"></div><div class="overlay hidden" id="overlay"><div class="card"><img class="result-cat" id="resultCat" alt=""><h2 id="resultTitle"></h2><p id="resultText"></p><button class="again" id="again">New Cat, New Chaos</button></div></div></main>
<script>
const cats=[{name:'Orange Menace',frames:['game-assets/orange-a.webp','game-assets/orange-b.webp'],title:'ORANGE YOU SORRY?'},{name:'Tuxedo Tornado',frames:['game-assets/tuxedo-a.webp','game-assets/tuxedo-b.webp'],title:'FORMALLY FLUNG!'},{name:'Floof Missile',frames:['game-assets/gray-a.webp','game-assets/gray-b.webp'],title:'FLOOF HAS FLOWN!'},{name:'Calico Chaos',frames:['game-assets/calico-a.webp','game-assets/calico-b.webp'],title:'CALICO CATAPULT!'}],$=id=>document.getElementById(id),wheel=$('wheel'),wheelWrap=$('wheelWrap'),cat=$('cat'),catImage=$('catImage'),needle=$('needle'),scoreEl=$('score'),bestEl=$('best'),catName=$('catName'),runButton=$('run'),overlay=$('overlay'),game=$('game'),resultText=$('resultText'),resultTitle=$('resultTitle'),resultCat=$('resultCat'),soundButton=$('sound'),countdown=$('countdown'),toast=$('toast');
let speed=0,score=0,best=Number(localStorage.getItem('wheelieCatBest')||0),rotation=0,started=false,ready=false,over=false,dangerTime=0,loafTime=0,last=performance.now(),soundOn=true,audioContext,currentCat,currentFrame=-1,lastCat=-1,toastTimer,loopId;bestEl.textContent=best;cats.flatMap(c=>c.frames).forEach(src=>{const img=new Image();img.src=src});
function beep(freq,duration,volume=.04,type='sine'){if(!soundOn)return;try{audioContext=audioContext||new(window.AudioContext||window.webkitAudioContext)();const osc=audioContext.createOscillator(),gain=audioContext.createGain();osc.frequency.value=freq;osc.type=type;gain.gain.value=volume;osc.connect(gain);gain.connect(audioContext.destination);osc.start();gain.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+duration);osc.stop(audioContext.currentTime+duration)}catch(e){}}
function showToast(text){toast.textContent=text;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),850)}
function chooseCat(){let pick;do{pick=Math.floor(Math.random()*cats.length)}while(cats.length>1&&pick===lastCat);lastCat=pick;currentCat=cats[pick];currentFrame=0;catImage.src=currentCat.frames[0];catName.textContent=currentCat.name;resultCat.src=currentCat.frames[0];resultCat.alt=currentCat.name}
function doCountdown(){ready=false;runButton.disabled=true;runButton.textContent='READY?';let n=3;countdown.classList.remove('hidden');function tick(){countdown.classList.remove('pop');void countdown.offsetWidth;countdown.textContent=n?n:'GO!';countdown.classList.add('pop');beep(n?260+(3-n)*100:620,n?.09:.18,.05,n?'sine':'square');if(n--){setTimeout(tick,650)}else setTimeout(()=>{countdown.classList.add('hidden');ready=true;started=true;speed=42;runButton.disabled=false;runButton.textContent='RUN!';showToast('Keep it in the green!');last=performance.now()},500)}tick()}
function tapRun(){if(over||!ready)return;speed=Math.min(112,speed+10.5);runButton.classList.add('pressed');setTimeout(()=>runButton.classList.remove('pressed'),65);beep(145+speed*2.8,.045,.022);if(navigator.vibrate)navigator.vibrate(10)}
function finish(reason='launch'){over=true;ready=false;runButton.disabled=true;best=Math.max(best,Math.floor(score));localStorage.setItem('wheelieCatBest',best);bestEl.textContent=best;if(reason==='loaf'){speed=0;cat.className='cat';wheelWrap.classList.remove('danger');resultTitle.textContent='LOAFED OUT!';resultText.textContent=currentCat.name+' stopped running, became bread, and took a nap. Final score: '+Math.floor(score)+'.';beep(210,.35,.05,'sine');showToast('💤 TOO MUCH LOAFING!');setTimeout(()=>overlay.classList.remove('hidden'),900);return}speed=108;cat.className='cat launched';game.classList.add('shake');wheel.classList.add('danger');beep(520,.12,.06,'square');setTimeout(()=>beep(760,.2,.05),100);if(navigator.vibrate)navigator.vibrate([70,40,120]);const endings=['has left the wheel — and possibly the county.','achieved excellent speed and a deeply questionable landing.','earned 10 points for distance and 0 for judgment.','is fine. Probably. The shrub broke the fall.'];resultTitle.textContent=currentCat.title;resultText.textContent=currentCat.name+' '+endings[Math.floor(Math.random()*endings.length)]+' Final score: '+Math.floor(score)+'.';setTimeout(()=>overlay.classList.remove('hidden'),720)}
function reset(){cancelAnimationFrame(loopId);speed=0;score=0;rotation=0;started=false;ready=false;over=false;dangerTime=0;loafTime=0;last=performance.now();scoreEl.textContent='0';needle.style.left='0%';wheel.style.transform='rotate(0deg)';wheel.classList.remove('danger');wheelWrap.classList.remove('danger');cat.className='cat';game.classList.remove('shake');overlay.classList.add('hidden');chooseCat();loopId=requestAnimationFrame(loop);setTimeout(doCountdown,250)}
function loop(now){if(over)return;const dt=Math.min(45,now-last);last=now;if(ready){const level=Math.min(1,score/250),greenLow=25+level*8,greenHigh=72-level*10;speed=Math.max(0,speed-dt*(.013+level*.006));rotation=(rotation+speed*dt*.0062)%360;wheel.style.transform='rotate('+rotation+'deg)';needle.style.left=Math.min(100,speed)+'%';const frame=speed<8?1:Math.floor(now/Math.max(75,230-speed*1.55))%2;if(frame!==currentFrame){currentFrame=frame;catImage.src=currentCat.frames[frame]}if(speed>=greenLow&&speed<=greenHigh){score+=dt*.017*(1+speed/75);scoreEl.textContent=Math.floor(score)}cat.className=speed<8?'cat':speed<84?'cat running':'cat wobble';if(speed<23){loafTime+=dt;if(loafTime>650&&loafTime<720)showToast('WAKE UP! TAP TAP TAP!')}else loafTime=Math.max(0,loafTime-dt*2);if(speed>72&&speed<=84&&Math.random()<.025)showToast('Easy there, '+currentCat.name+'!');if(speed>84){wheelWrap.classList.add('danger');if(Math.random()<.04)showToast('ABORT ZOOMIES!')}else wheelWrap.classList.remove('danger');if(speed>96)dangerTime+=dt;else dangerTime=Math.max(0,dangerTime-dt*1.5);if(loafTime>2100){finish('loaf');return}if(dangerTime>330){finish('launch');return}}loopId=requestAnimationFrame(loop)}
runButton.addEventListener('pointerdown',tapRun);document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();tapRun()}});$('again').addEventListener('click',reset);soundButton.addEventListener('click',()=>{soundOn=!soundOn;soundButton.textContent=soundOn?'🔊':'🔇';soundButton.setAttribute('aria-label',soundOn?'Turn sound off':'Turn sound on')});reset();
</script></body></html>
