<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baytowne Puke History</title>
<style>
:root{--blue:#1976d2;--navy:#173b57;--line:#dbe4ec;--soft:#f5f7fa}
*{box-sizing:border-box}body{margin:0;background:var(--soft);color:#1f2933;font-family:Arial,sans-serif}header{background:var(--blue);color:#fff;padding:16px;text-align:center;font-size:23px;font-weight:700}
.container{max-width:900px;margin:auto;padding:16px}.back{display:inline-block;margin-bottom:14px;padding:9px 14px;background:var(--blue);color:#fff;text-decoration:none;border-radius:8px;font-weight:700}
h1{font-size:28px;margin:2px 0 4px;color:var(--navy)}.sub{color:#5f6c78;margin:0 0 14px}.summary{font-size:14px;color:#52606d;margin:8px 2px}
.tableWrap{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1);overflow:hidden}.head,.row{display:grid;grid-template-columns:90px 110px 130px 120px minmax(180px,1fr)}
.head{background:var(--navy);color:#fff;font-weight:700;font-size:14px}.head div,.row>div{padding:11px 9px;border-right:1px solid #e5e7eb}.row{border-bottom:1px solid var(--line);font-size:14px}.row:last-child{border-bottom:0}.date{font-weight:700}.small{font-size:12px;color:#687784;margin-top:3px}.yes{font-weight:700;color:#991b1b}.no{font-weight:700;color:#166534}.state{padding:26px 16px;text-align:center;color:#5f6c78}
@media(max-width:650px){.head,.row{grid-template-columns:78px 82px 95px 90px minmax(150px,1fr);font-size:12px}.head div,.row>div{padding:8px 5px}.container{padding:10px}}
</style></head><body><header>Baytowne Puke History</header><main class="container"><a class="back" href="baytowne.html">← Baytowne</a><h1>🤮 Puke History</h1><p class="sub">Baytowne puke reports, newest first.</p><div id="summary" class="summary">Loading…</div><section class="tableWrap"><div class="head"><div>Date</div><div>Shift</div><div>Volunteer</div><div>Horker</div><div>Details</div></div><div id="rows"><div class="state">Loading…</div></div></section></main>
<script>
const SETTINGS_URL="https://script.google.com/macros/s/AKfycbxjbnFhs4Q0dUt9PGbd1z8PlRTzCwu-c6ge2ZsAj9-HqYsdcs_Sj26zql_hXSzZGG_b/exec?action=settings";
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
async function load(){try{const s=await fetch(SETTINGS_URL).then(r=>r.json());if(!s.PortalDeploymentURL)throw Error();const d=await fetch(s.PortalDeploymentURL+"?action=pukeHistory&limit=1000").then(r=>r.json());if(!d||!d.success||!Array.isArray(d.records))throw Error();const rows=d.records.sort((a,b)=>Number(b.timestamp)-Number(a.timestamp));document.getElementById("summary").textContent=rows.length+(rows.length===1?" entry":" entries");document.getElementById("rows").innerHTML=rows.length?rows.map(r=>'<div class="row"><div class="date">'+esc(r.date)+'<div class="small">'+esc(r.weekday)+'</div></div><div>'+esc(r.shift)+'</div><div>'+esc(r.volunteer)+'</div><div class="'+(r.puke==="No"?"no":"yes")+'">'+esc(r.puke==="No"?"None":r.horker||"Unknown Horker")+'</div><div>'+esc(r.details||"")+'</div></div>').join(""):'<div class="state">No puke reports yet.</div>'}catch(e){document.getElementById("summary").textContent="";document.getElementById("rows").innerHTML='<div class="state">Puke history is temporarily unavailable.</div>'}}
load();
</script></body></html>
